# Render Blueprint for EcoSense AI
# Deploy all services with: render blueprint deploy
#
# FREE TIER CONFIGURATION:
# - All services use Render's free web service tier
# - Free services cannot use private networking (internal DNS)
# - Services communicate via public HTTPS URLs (*.onrender.com)
# - Free services spin down after 15 minutes of inactivity

services:
  # Frontend - Static Site (always free)
  - type: web
    name: ecosense-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: ecosense-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_ML_SERVICE_URL
        fromService:
          name: ecosense-ml-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_CESIUM_ION_TOKEN
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  # Backend API - Node.js (free tier)
  - type: web
    name: ecosense-backend
    runtime: node
    region: oregon
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COPERNICUS_CLIENT_ID
        sync: false  # Set in Render dashboard - from Sentinel Hub
      - key: COPERNICUS_CLIENT_SECRET
        sync: false  # Set in Render dashboard - from Sentinel Hub
      - key: ML_SERVICE_HOST
        fromService:
          name: ecosense-ml-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ALLOWED_ORIGINS
        sync: false  # Set to frontend URL (e.g., https://ecosense-frontend.onrender.com)
      - key: OLLAMA_BASE_URL
        value: ""  # Leave empty - Ollama not deployed
      - key: LLM_PROVIDER
        value: fallback
    healthCheckPath: /health
    autoDeploy: true

  # ML Service - Python (free tier)
  - type: web
    name: ecosense-ml-service
    runtime: python
    region: oregon
    buildCommand: cd ml-service && pip install -r requirements.txt
    startCommand: cd ml-service && python main.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_DEVICE
        value: cpu
      - key: ALLOWED_ORIGINS
        sync: false  # Set to backend + frontend URLs (comma-separated)
    healthCheckPath: /health
    autoDeploy: true
