# Render Blueprint for EcoSense AI
# Backend + ML Service only — Frontend is on GitHub Pages
#
# FREE TIER NOTES:
# - Free web services spin down after 15 min inactivity (cold start ~30s)
# - No credit card required
# - Services communicate via public HTTPS (*.onrender.com)
#
# DEPLOY:
# 1. Go to https://dashboard.render.com/blueprints
# 2. Click "New Blueprint Instance"
# 3. Connect the GitHub repo Shreyasiyer2005/EcoSense-AI-1
# 4. Render will detect this file and create both services
# 5. Add COPERNICUS_CLIENT_ID and COPERNICUS_CLIENT_SECRET manually in each service's dashboard

services:
  # Backend API - Node.js
  - type: web
    name: ecosense-backend
    runtime: node
    region: oregon
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: COPERNICUS_CLIENT_ID
        sync: false
      - key: COPERNICUS_CLIENT_SECRET
        sync: false
      - key: ML_SERVICE_HOST
        fromService:
          name: ecosense-ml-service
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: ALLOWED_ORIGINS
        value: https://shreyasiyer2005.github.io
      - key: LLM_PROVIDER
        value: fallback
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /health
    autoDeploy: true

  # ML Service - Python FastAPI
  - type: web
    name: ecosense-ml-service
    runtime: python
    region: oregon
    buildCommand: cd ml-service && pip install -r requirements.txt
    startCommand: cd ml-service && python main.py
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://shreyasiyer2005.github.io,https://ecosense-backend.onrender.com
      - key: PORT
        value: 8000
    healthCheckPath: /health
    autoDeploy: true
